name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Instalar dependências (versões compatíveis com o Expo)
        run: |
          npm install
          DEPS=$(node -p "require('./package.json').appDependencies.join(' ')")
          DEV=$(node -p "require('./package.json').appDevDependencies.join(' ')")
          npx expo install $DEPS
          npx expo install $DEV -- --save-dev
          echo "---- versões resolvidas ----"
          node -p "JSON.stringify({...require('./package.json').dependencies, ...require('./package.json').devDependencies}, null, 2)"

      - name: Testes da classificação de variantes
        run: npm test

      - name: Verificação de tipos
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Número da versão
        run: |
          node -e "
            const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p));
            j.expo.android.versionCode=${{ github.run_number }};
            j.expo.version='1.0.${{ github.run_number }}';
            fs.writeFileSync(p, JSON.stringify(j,null,2));"

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Assinatura fixa (permite atualizar o app sem perder dados)
        run: cp keystore/app.keystore android/app/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ColecaoTCG-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ColecaoTCG-*.apk

      - name: Publicar versão para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Coleção TCG 1.0.${{ github.run_number }}
          body: Baixe o arquivo .apk abaixo no celular e toque nele para instalar ou atualizar.
          files: ColecaoTCG-*.apk
