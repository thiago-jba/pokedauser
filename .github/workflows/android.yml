name: Publicar app

# A cada envio para a main:
#  - publica uma atualização automática (o app baixa sozinho ao abrir);
#  - gera um APK novo SÓ quando muda algo "estrutural" (dependências, ícone, configuração),
#    ou quando a mensagem do commit tem [apk], ou ao rodar manualmente.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Precisa de APK novo?
        id: decide
        run: |
          APK=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then APK=true; fi
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED="(primeiro commit)"; APK=true
          fi
          echo "Arquivos alterados:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(package\.json|app\.json|eas\.json|assets/|keystore/|\.github/)'; then APK=true; fi
          if git log -1 --pretty=%B | grep -qi '\[apk\]'; then APK=true; fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Gerar APK: $APK"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        if: steps.decide.outputs.apk == 'true'
        with:
          distribution: zulu
          java-version: 17

      - name: Instalar dependências (versões compatíveis com o Expo)
        run: |
          npm install
          DEPS=$(node -p "require('./package.json').appDependencies.join(' ')")
          DEV=$(node -p "require('./package.json').appDevDependencies.join(' ')")
          npx expo install $DEPS
          npx expo install $DEV -- --save-dev

      - name: Testes da classificação de variantes
        run: npm test

      - name: Verificação de tipos
        run: npx tsc --noEmit

      - name: Ligar ao projeto no Expo
        if: env.EXPO_TOKEN != ''
        run: |
          npx --yes eas-cli@latest init --non-interactive --force
          node -e "
            const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json'));
            const id=j.expo.extra&&j.expo.extra.eas&&j.expo.extra.eas.projectId;
            if(!id){console.error('projectId não encontrado');process.exit(1);}
            j.expo.updates.url='https://u.expo.dev/'+id;
            fs.writeFileSync('app.json', JSON.stringify(j,null,2));
            console.log('Projeto Expo:', id);"

      - name: Sem token do Expo — desliga atualização automática
        if: env.EXPO_TOKEN == ''
        run: |
          node -e "
            const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json'));
            j.expo.updates.enabled=false;fs.writeFileSync('app.json', JSON.stringify(j,null,2));"

      - name: Publicar atualização automática
        if: env.EXPO_TOKEN != ''
        run: |
          MSG=$(git log -1 --pretty=%s | cut -c1-200)
          npx --yes eas-cli@latest update --channel production --platform android --environment production --message "$MSG" --non-interactive

      # ---------- versão para navegador (computador) ----------

      - name: Publicar versão web
        if: env.EXPO_TOKEN != ''
        run: |
          set -o pipefail
          rm -rf dist
          ( npx expo export --platform web && npx --yes eas-cli@latest deploy --prod --non-interactive ) 2>&1 | tee web.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.expo\.app' web.log | tail -1 || true)
          echo "::notice title=Endereço da versão web::${URL:-não encontrado no log}"
        continue-on-error: true

      - name: Detalhes da versão web
        if: always()
        run: |
          if [ -f web.log ]; then
            MSG=$(grep -v '^\s*$' web.log | tail -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=Log da versão web::${MSG}"
          fi

      # ---------- APK (só quando necessário) ----------

      - name: Número da versão
        if: steps.decide.outputs.apk == 'true'
        run: |
          node -e "
            const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json'));
            j.expo.android.versionCode=${{ github.run_number }};
            j.expo.version='1.0.${{ github.run_number }}';
            fs.writeFileSync('app.json', JSON.stringify(j,null,2));"

      - name: Gerar projeto Android
        if: steps.decide.outputs.apk == 'true'
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Assinatura fixa (permite atualizar o app sem perder dados)
        if: steps.decide.outputs.apk == 'true'
        run: cp keystore/app.keystore android/app/debug.keystore

      - name: Compilar APK
        if: steps.decide.outputs.apk == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Renomear APK
        if: steps.decide.outputs.apk == 'true'
        run: cp android/app/build/outputs/apk/release/app-release.apk ColecaoTCG-1.0.${{ github.run_number }}.apk

      - name: Publicar APK para download
        if: steps.decide.outputs.apk == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Coleção TCG 1.0.${{ github.run_number }}
          body: Baixe o arquivo .apk abaixo no celular e toque nele para instalar ou atualizar. A coleção continua salva.
          files: ColecaoTCG-*.apk
